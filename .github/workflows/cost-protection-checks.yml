name: Cost protection checks
on:
  push:
    branches: ['cost-protection/early-bird-20261013']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: cost-checks-${{ github.ref }}
  cancel-in-progress: true
jobs:
  offline-security:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    services:
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      NEXT_TELEMETRY_DISABLED: '1'
      RUDIE_TEST_REDIS: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run test:security
      - run: python3 -m pip install --quiet redis
      - run: python3 tests/cost-quotas.py
      - run: npx tsc --noEmit
      - run: npm run build
      - run: python3 -m pip install --quiet pyyaml
      - run: python3 tests/backup-bounds.py
      - run: python3 tests/http-regression.py
      - name: Verify backup and retention boundaries
        run: |
          python3 - <<'PY'
          from pathlib import Path
          s=Path('.github/workflows/r2-backup.yml').read_text()
          for value in ["timeout-minutes: 10","group: early-bird-r2-backup","cancel-in-progress: false","AWS_MAX_ATTEMPTS: 2","AWS_RETRY_MODE: standard","33554432",'NAME="early-bird-$DATE.tar.gz"',"BACKUPS_DISABLED","refs/heads/main"]:
              assert value in s,value
          assert 'put-bucket-lifecycle' not in s and 'put-bucket-policy' not in s
          print('PASS: backup bounds; no lifecycle/policy mutation')
          PY
      - name: Verify combined PR 1 and mobile PR 2 tree
        run: |
          git fetch origin 3229b9906e0874554973b4ffbe0d884e6db2aff2
          test "$(git diff --name-only $(git merge-base HEAD FETCH_HEAD) FETCH_HEAD)" = "app/globals.css"
          COMBINED_TREE=$(git merge-tree --write-tree HEAD FETCH_HEAD)
          git read-tree --reset -u "$COMBINED_TREE"
          python3 - <<'PYTEST'
          from pathlib import Path
          assert '.quickInfoItem span span br{display:none}' not in Path('app/globals.css').read_text()
          print('PASS: conflict-free combined tree; mobile line breaks retained')
          PYTEST
          npm run test:security
          npx tsc --noEmit
          npm run build
          python3 tests/http-regression.py
