name: Cost protection checks
on:
  push:
    branches: ['cost-protection/early-bird-20261013']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: cost-checks-${{ github.ref }}
  cancel-in-progress: true
jobs:
  offline-security:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    services:
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      NEXT_TELEMETRY_DISABLED: '1'
      RUDIE_TEST_REDIS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run test:security
      - run: python3 -m pip install --quiet redis
      - run: python3 tests/cost-quotas.py
      - run: npx tsc --noEmit
      - run: npm run build
      - run: python3 -m pip install --quiet pyyaml
      - run: python3 tests/backup-bounds.py
      - run: python3 tests/http-regression.py
      - name: Verify backup and retention boundaries
        run: |
          python3 - <<'PY'
          from pathlib import Path
          s=Path('.github/workflows/r2-backup.yml').read_text()
          for value in ["timeout-minutes: 10","group: early-bird-r2-backup","cancel-in-progress: false","AWS_MAX_ATTEMPTS: 2","AWS_RETRY_MODE: standard","33554432",'NAME="early-bird-$DATE.tar.gz"',"BACKUPS_DISABLED","refs/heads/main"]:
              assert value in s,value
          assert 'put-bucket-lifecycle' not in s and 'put-bucket-policy' not in s
          print('PASS: backup bounds; no lifecycle/policy mutation')
          PY
      - name: Test current stable Next.js without changing the committed pin
        run: |
          npm install --no-save --package-lock=false --ignore-scripts --no-audit --no-fund next@16.4.0
          npm run test:security
          npx tsc --noEmit
          npm run build
          python3 tests/http-regression.py
      - name: One-time bounded live spoof-header check (no token, no emails)
        if: github.run_number == 2 && github.run_attempt == 1
        run: python3 tests/live-ip-probe.py
