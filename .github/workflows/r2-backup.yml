name: Early Bird R2 offsite backup
on:
  schedule:
    - cron: '17 9 * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: early-bird-r2-backup
  cancel-in-progress: false
jobs:
  backup:
    if: github.ref == 'refs/heads/main' && vars.BACKUPS_DISABLED != 'true'
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Verify configuration
        env:
          ACCOUNT: ${{ secrets.R2_ACCOUNT_ID }}
          KEY: ${{ secrets.R2_ACCESS_KEY_ID }}
          SECRET: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          BUCKET: ${{ secrets.R2_BUCKET }}
        run: |
          for v in ACCOUNT KEY SECRET BUCKET; do
            if [ -z "${!v}" ]; then echo "::error::Missing R2 backup secret: $v"; exit 1; fi
          done
      - name: Create and upload source and asset backup
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          AWS_MAX_ATTEMPTS: 2
          AWS_RETRY_MODE: standard
          ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          BUCKET: ${{ secrets.R2_BUCKET }}
        run: |
          set -euo pipefail
          python -m pip install --quiet awscli
          DATE="$(date -u +%Y-%m-%d)"
          NAME="early-bird-$DATE.tar.gz"
          tar -czf "/tmp/$NAME" --exclude=.git --exclude=node_modules --exclude=.next .
          BYTES="$(stat -c%s "/tmp/$NAME")"
          if [ "$BYTES" -gt 33554432 ]; then echo "::error::Backup exceeds 32 MiB allowance"; exit 1; fi
          sha256sum "/tmp/$NAME" | awk '{print $1}' > "/tmp/$NAME.sha256"
          ENDPOINT="https://$ACCOUNT_ID.r2.cloudflarestorage.com"
          aws --endpoint-url "$ENDPOINT" s3 cp "/tmp/$NAME" "s3://$BUCKET/early-bird/$NAME"
          aws --endpoint-url "$ENDPOINT" s3 cp "/tmp/$NAME.sha256" "s3://$BUCKET/early-bird/$NAME.sha256"
          aws --endpoint-url "$ENDPOINT" s3api head-object --bucket "$BUCKET" --key "early-bird/$NAME" >/dev/null
          echo "Backup uploaded and verified: $NAME"

      - name: Report verified backup to Rudie Digital
        if: success()
        env:
          RD_EARLY_BIRD_HEALTH_SECRET: ${{ secrets.RD_EARLY_BIRD_HEALTH_SECRET }}
        run: |
          set -euo pipefail
          if [ -z "${RD_EARLY_BIRD_HEALTH_SECRET:-}" ]; then
            echo "::notice::Early Bird status reporting is not configured yet."
            exit 0
          fi
          python - <<'PY' > /tmp/rd-backup-status.json
          import json,os
          from datetime import datetime,timezone
          print(json.dumps({"repository":"rwatzig-maker/Early-Bird","verified":True,
            "run_id":os.environ["GITHUB_RUN_ID"],
            "timestamp":datetime.now(timezone.utc).isoformat()}))
          PY
          curl --fail-with-body --silent --show-error --max-time 15 --retry 2 \
            -H "Authorization: Bearer $RD_EARLY_BIRD_HEALTH_SECRET" \
            -H "Content-Type: application/json" \
            --data-binary @/tmp/rd-backup-status.json \
            https://rudie.org/api/integrations/early-bird-backup
